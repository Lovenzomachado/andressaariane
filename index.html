<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Andressa Ariane | Portfolio</title>
  <style>
    /* Seu CSS permanece igual, sem alterações */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap');

    @font-face {
      font-family: 'Mango Grotesque';
      src: url('https://raw.githubusercontent.com/Lovenzomachado/andressaariane/main/Mango%20Grotesque.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    #portfolio-root {
      width: 100%;
      height: 100vh;
      min-height: 520px;
      overflow: hidden;
      position: relative;
      background: #fff;
      font-family: 'DM Sans', sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      height: 100%;
      position: relative;
    }

    nav {
      grid-column: 1 / 9;
      position: absolute;
      top: 26px;
      left: 0;
      right: 0;
      padding-left: 52px;
      padding-right: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    
    .nav-logo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #000;
      pointer-events: auto;
    }
    
    .nav-logo .logo-img {
      height: 56px;
      width: auto;
      display: block;
    }
    
    .nav-links { display: flex; gap: 28px; }
    .nav-links a {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #2E3EFC;
      text-decoration: none;
      pointer-events: all;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: #080F66; }

    .col-left {
      grid-column: 1 / 9;
      position: relative;
      overflow: hidden;
    }

    .col-right {
      grid-column: 9 / 13;
      position: relative;
      overflow: hidden;
    }

    .project-track {
      position: absolute;
      width: 100%;
      will-change: transform;
    }

    .project-item {
      padding: 0 28px 0 0;
      user-select: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      opacity: 0.2;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-item.active { opacity: 1; }

    .project-item .label {
      display: block;
      font-family: 'Mango Grotesque', 'DM Sans', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 168px;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #000;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .project-item .tag {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #aaa;
      white-space: nowrap;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.8s ease 0.15s;
      margin-left: 30px;
    }
    .project-item.active .tag { opacity: 1; }

    .image-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
    }

    .image-slot {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .image-slide {
      position: absolute;
      inset: 0;
    }
    .image-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-label {
      position: absolute;
      bottom: 14px;
      left: 16px;
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
    }

    .scroll-hint {
      position: absolute;
      bottom: 26px; left: 52px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .scroll-hint::before {
      content: '';
      display: block;
      width: 20px;
      height: 0.5px;
      background: #ccc;
    }

    .counter {
      position: absolute;
      bottom: 26px; right: 26px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: #ccc;
      z-index: 10;
    }
    .counter span { color: #000; font-size: 12px; font-weight: 700; }

    @media (max-width: 1400px) {
      .project-item .label { font-size: 148px; }
      .project-item { padding: 0 24px 0 0; }
    }
    @media (max-width: 1200px) {
      .project-item .label { font-size: 120px; }
    }
    @media (max-width: 1000px) {
      .project-item .label { font-size: 90px; }
      .project-item { padding: 0 20px 0 0; }
    }
    @media (max-width: 800px) {
      .project-item .label { font-size: 75px; }
    }

    @media (max-width: 768px) {
      .col-right { display: none; }
      .col-left { 
        grid-column: 1 / 13;
        display: flex;
        flex-direction: column;
      }
      .mobile-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        position: relative;
      }
      .mobile-image-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #f5f5f5;
        min-height: 40%;
      }
      .mobile-image-stage {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .mobile-image-stage img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mobile-img-label {
        position: absolute;
        bottom: 14px;
        left: 16px;
        font-size: 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 300;
        z-index: 2;
      }
      .mobile-labels-container {
        height: auto;
        overflow: hidden;
        background: #fff;
      }
      .project-track-mobile {
        width: 100%;
        will-change: transform;
      }
      .project-item-mobile {
        padding: 0 28px 0 32px;
        user-select: none;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        opacity: 0.2;
        transition: opacity 0.3s ease;
      }
      .project-item-mobile.active { opacity: 1; }
      .project-item-mobile .label {
        display: block;
        font-family: 'Mango Grotesque', 'DM Sans', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 55px;
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: #000;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .project-item-mobile .tag {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 8px;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #aaa;
        white-space: nowrap;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.3s ease;
        margin-left: 15px;
      }
      .project-item-mobile.active .tag { opacity: 1; }
      nav { 
        grid-column: 1 / 13; 
        padding-left: 32px; 
        top: 20px; 
      }
      .scroll-hint { left: 32px; bottom: 20px; }
      .counter { right: 20px; bottom: 20px; }
      .nav-logo .logo-img { height: 20px; }
    }

    @media (max-width: 600px) {
      .project-item-mobile .label { font-size: 45px; }
    }
    @media (max-width: 480px) {
      .project-item-mobile .label { font-size: 38px; }
      .project-item-mobile .tag { font-size: 7px; margin-left: 12px; }
    }
    @media (max-width: 400px) {
      .project-item-mobile .label { font-size: 32px; }
    }
  </style>
</head>
<body>
<div id="portfolio-root">
  <div class="grid">
    <nav>
      <div class="nav-logo">
        <img src="https://raw.githubusercontent.com/Lovenzomachado/andressaariane/main/logo.svg" alt="Andressa Ariane" class="logo-img">
      </div>
      <div class="nav-links">
        <a href="#">Sobre mim</a>
        <a href="#">Contato</a>
      </div>
    </nav>
    
    <!-- Desktop -->
    <div class="col-left" id="left-col">
      <div class="project-track" id="project-track"></div>
    </div>
    <div class="col-right">
      <div class="image-stage" id="image-stage">
        <div class="image-slot" id="slot-top"></div>
        <div class="image-slot" id="slot-bot"></div>
      </div>
    </div>
    
    <!-- Mobile -->
    <div class="col-left mobile-only" id="mobile-col" style="display: none;">
      <div class="mobile-container">
        <div class="mobile-image-container">
          <div class="mobile-image-stage" id="mobile-image-stage"></div>
        </div>
        <div class="mobile-labels-container">
          <div class="project-track-mobile" id="project-track-mobile"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="scroll-hint">Scroll para navegar</div>
  <div class="counter"><span id="counter-num">01</span> / 06</div>
</div>

<script>
// ========================== PROJETOS ==========================
const IMG_BASE_URL = 'https://raw.githubusercontent.com/Lovenzomachado/andressaariane/main/projects/';
const projects = [
  { name: "Ipanema Pluma",   tag: "Identidade Visual", images: [`${IMG_BASE_URL}ipanema-pluma.avif`, `${IMG_BASE_URL}ipanema-pluma.avif`] },
  { name: "Quinto Andar",    tag: "Branding Digital",  images: [`${IMG_BASE_URL}quintoandar.avif`, `${IMG_BASE_URL}quintoandar.avif`] },
  { name: "Élev Experience", tag: "Skincare Print",    images: [`${IMG_BASE_URL}elev.avif`, `${IMG_BASE_URL}elev.avif`] },
  { name: "Unimed VTRP",     tag: "Campanha",          images: [`${IMG_BASE_URL}unimed.avif`, `${IMG_BASE_URL}unimed.avif`] },
  { name: "Kero Fazê",       tag: "Social Media",      images: [`${IMG_BASE_URL}kerofaze.avif`, `${IMG_BASE_URL}kerofaze.avif`] },
  { name: "Museu da PUC",    tag: "Editorial",         images: [`${IMG_BASE_URL}puc.avif`, `${IMG_BASE_URL}puc.avif`] }
];

// ========================== PRÉ-CARREGAMENTO ==========================
function preloadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Falha: ${url}`));
    img.src = url;
  });
}

// ========================== CONFIGURAÇÃO ==========================
const CONFIG = {
  ITEM_H: 170,
  COPIES: 7,
  LERP: 0.038,
  WHEEL_SPEED: 0.42,
  TOUCH_SPEED: 1.1,
  IDLE_MS: 220,
  ENTER_DELAY_MS: 380,
  EXIT: { duration: 200, easing: 'cubic-bezier(0.4, 0, 1, 1)', translateX: -24 },
  ENTER: {
    duration: 500,
    easing: 'cubic-bezier(0.19, 1, 0.22, 1)',
    translateX: '100%',   // ← AGORA SAI COMPLETAMENTE DA TELA (deslocamento de 100% da largura)
    stagger: 60,
  },
};

function getItemHeight() {
  const label = document.querySelector('.project-item .label');
  if (!label) return 170;
  const fontSize = parseFloat(getComputedStyle(label).fontSize);
  return Math.ceil(fontSize * 0.9 + 30);
}
function getMobileItemHeight() {
  const label = document.querySelector('.project-item-mobile .label');
  if (!label) return 70;
  const fontSize = parseFloat(getComputedStyle(label).fontSize);
  return Math.ceil(fontSize * 0.9 + 20);
}

// ========================== ELEMENTOS ==========================
const total = projects.length;
const track = document.getElementById('project-track');
const stage = document.getElementById('image-stage');
const slotTop = document.getElementById('slot-top');
const slotBot = document.getElementById('slot-bot');
const counterNum = document.getElementById('counter-num');
const leftCol = document.getElementById('left-col');
const mobileCol = document.getElementById('mobile-col');
const mobileImageStage = document.getElementById('mobile-image-stage');
const mobileTrack = document.getElementById('project-track-mobile');
const COPIES_ABOVE = Math.floor(CONFIG.COPIES / 2);

// ========================== DETECTA MOBILE ==========================
let isMobile = window.innerWidth <= 768;
function checkMobile() {
  isMobile = window.innerWidth <= 768;
  if (isMobile) {
    document.querySelector('.col-right').style.display = 'none';
    leftCol.style.display = 'none';
    mobileCol.style.display = 'block';
    mobileCol.style.gridColumn = '1 / 13';
    initMobile();
  } else {
    document.querySelector('.col-right').style.display = 'block';
    leftCol.style.display = 'block';
    mobileCol.style.display = 'none';
  }
}

// ========================== DESKTOP – LISTA ==========================
for (let c = 0; c < CONFIG.COPIES; c++) {
  projects.forEach(p => {
    const el = document.createElement('div');
    el.className = 'project-item';
    el.style.height = CONFIG.ITEM_H + 'px';
    el.innerHTML = `<span class="label">${p.name}</span><span class="tag">${p.tag}</span>`;
    track.appendChild(el);
  });
}
const allItems = Array.from(track.querySelectorAll('.project-item'));
setTimeout(() => {
  CONFIG.ITEM_H = getItemHeight();
  allItems.forEach(item => { item.style.height = CONFIG.ITEM_H + 'px'; });
}, 100);

// ========================== MOBILE – LISTA ==========================
let mobileItems = [];
let mobileScrollY = 0, mobileTargetY = 0, mobilePrevScrollY = 0;
let mobileLastDir = 1, mobileIsScrolling = false, mobileIdleTimer = null, mobileEnterTimer = null;
let mobileItemHeight = 70;

function initMobile() {
  if (!mobileTrack) return;
  mobileTrack.innerHTML = '';
  mobileItemHeight = getMobileItemHeight();
  for (let c = 0; c < CONFIG.COPIES; c++) {
    projects.forEach(p => {
      const el = document.createElement('div');
      el.className = 'project-item-mobile';
      el.style.height = mobileItemHeight + 'px';
      el.innerHTML = `<span class="label">${p.name}</span><span class="tag">${p.tag}</span>`;
      mobileTrack.appendChild(el);
    });
  }
  mobileItems = Array.from(mobileTrack.querySelectorAll('.project-item-mobile'));
}

// ========================== MOBILE – IMAGEM (com pré-carga) ==========================
let currentMobileAnimation = null;
async function showMobileImage(idx) {
  if (!mobileImageStage) return;
  const p = projects[idx];
  const imgUrl = p.images[0];
  mobileImageStage.style.opacity = '0';
  try {
    await preloadImage(imgUrl);
    if (currentMobileAnimation) currentMobileAnimation.cancel();
    mobileImageStage.innerHTML = '';
    const slide = document.createElement('div');
    slide.style.position = 'absolute';
    slide.style.inset = '0';
    slide.innerHTML = `<img src="${imgUrl}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" /><span class="mobile-img-label">${p.tag}</span>`;
    slide.style.transform = `translateX(${CONFIG.ENTER.translateX})`; // agora usa '%'
    mobileImageStage.appendChild(slide);
    mobileImageStage.style.opacity = '1';
    currentMobileAnimation = slide.animate(
      [{ transform: `translateX(${CONFIG.ENTER.translateX})` }, { transform: 'translateX(0px)' }],
      { duration: CONFIG.ENTER.duration, easing: CONFIG.ENTER.easing, fill: 'forwards' }
    );
  } catch (err) { console.error(err); }
}
function hideMobileStage() { if (mobileImageStage) mobileImageStage.style.opacity = '0'; }
function onMobileIdle() {
  mobileIsScrolling = false;
  const idx = getMobileActiveIndex(mobileScrollY);
  clearTimeout(mobileEnterTimer);
  mobileEnterTimer = setTimeout(() => showMobileImage(idx), CONFIG.ENTER_DELAY_MS);
}
function handleMobileInput(delta) {
  mobileTargetY += delta;
  clearTimeout(mobileEnterTimer);
  if (!mobileIsScrolling) { mobileIsScrolling = true; hideMobileStage(); }
  clearTimeout(mobileIdleTimer);
  mobileIdleTimer = setTimeout(onMobileIdle, CONFIG.IDLE_MS);
}
function getMobileActiveIndex(y) {
  const wrap = total * mobileItemHeight;
  return Math.round(((y % wrap) + wrap) % wrap / mobileItemHeight) % total;
}
function mobileLoop() {
  if (!isMobile) return;
  mobileScrollY += (mobileTargetY - mobileScrollY) * CONFIG.LERP;
  const wrap = total * mobileItemHeight;
  const wrapLow = COPIES_ABOVE * total * mobileItemHeight - wrap;
  const wrapHigh = COPIES_ABOVE * total * mobileItemHeight + wrap * (CONFIG.COPIES - COPIES_ABOVE - 1);
  if (mobileScrollY > wrapHigh) { mobileScrollY -= wrap; mobileTargetY -= wrap; }
  if (mobileScrollY < wrapLow) { mobileScrollY += wrap; mobileTargetY += wrap; }
  const container = document.querySelector('.mobile-labels-container');
  if (container) {
    const center = container.clientHeight / 2 - mobileItemHeight / 2;
    if (mobileTrack) mobileTrack.style.transform = `translateY(${Math.round(-mobileScrollY + center)}px)`;
  }
  const vel = mobileScrollY - mobilePrevScrollY;
  if (Math.abs(vel) > 0.01) mobileLastDir = vel > 0 ? 1 : -1;
  mobilePrevScrollY = mobileScrollY;
  const ai = getMobileActiveIndex(mobileScrollY);
  if (counterNum) counterNum.textContent = String(ai + 1).padStart(2, '0');
  if (mobileItems.length) mobileItems.forEach((el, gi) => el.classList.toggle('active', (gi % total) === ai));
  requestAnimationFrame(mobileLoop);
}

// ========================== DESKTOP – IMAGEM (pré‑carga + translateX com %) ==========================
let currentAnimations = [];
async function showProject(idx, dir) {
  if (state.activeIdx === idx) return;
  state.activeIdx = idx;
  state.visible = true;
  clearSlots();
  const p = projects[idx];
  const xStart = CONFIG.ENTER.translateX;   // agora é '100%'
  const slots = [slotBot, slotTop];
  currentAnimations.forEach(anim => { if (anim) anim.cancel(); });
  currentAnimations = [];
  try {
    await Promise.all([preloadImage(p.images[0]), preloadImage(p.images[0])]);
    for (let si = 0; si < slots.length; si++) {
      const slot = slots[si];
      const slide = document.createElement('div');
      slide.className = 'image-slide';
      slide.innerHTML = `<img src="${p.images[0]}" alt="${p.name}" /><span class="img-label">${p.tag} — 0${si+1}</span>`;
      slide.style.transform = `translateX(${xStart})`;  // usa '%'
      slot.appendChild(slide);
      const delay = si === 0 ? 0 : CONFIG.ENTER.stagger;
      const anim = slide.animate(
        [{ transform: `translateX(${xStart})` }, { transform: 'translateX(0px)' }],
        { duration: CONFIG.ENTER.duration, delay, easing: CONFIG.ENTER.easing, fill: 'forwards' }
      );
      currentAnimations.push(anim);
    }
    stage.style.transition = 'opacity 0.2s ease';
    stage.style.opacity = '1';
  } catch (err) { console.error(err); }
}

// ========================== DESKTOP – SCROLL ==========================
let INITIAL_SCROLL = COPIES_ABOVE * total * CONFIG.ITEM_H;
let scrollY = INITIAL_SCROLL, targetY = INITIAL_SCROLL, prevScrollY = INITIAL_SCROLL;
let lastDir = 1, isScrolling = false, idleTimer = null, enterTimer = null;
const state = { visible: false, activeIdx: -1 };
function clearSlots() { slotTop.innerHTML = ''; slotBot.innerHTML = ''; }
function hideStage() {
  if (!state.visible) return;
  state.visible = false; state.activeIdx = -1;
  stage.style.transition = 'opacity 0.3s ease';
  stage.style.opacity = '0';
  setTimeout(clearSlots, 320);
}
function getActiveIndex(y) {
  const wrap = total * CONFIG.ITEM_H;
  return Math.round(((y % wrap) + wrap) % wrap / CONFIG.ITEM_H) % total;
}
function onIdle() {
  isScrolling = false;
  const idx = getActiveIndex(scrollY);
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => showProject(idx, lastDir), CONFIG.ENTER_DELAY_MS);
}
function handleInput(delta) {
  if (isMobile) { handleMobileInput(delta); return; }
  targetY += delta;
  clearTimeout(enterTimer);
  if (!isScrolling) { isScrolling = true; hideStage(); }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdle, CONFIG.IDLE_MS);
}
function loop() {
  if (isMobile) { requestAnimationFrame(loop); return; }
  scrollY += (targetY - scrollY) * CONFIG.LERP;
  const wrap = total * CONFIG.ITEM_H;
  const wrapLow = INITIAL_SCROLL - wrap;
  const wrapHigh = INITIAL_SCROLL + wrap * (CONFIG.COPIES - COPIES_ABOVE - 1);
  if (scrollY > wrapHigh) { scrollY -= wrap; targetY -= wrap; }
  if (scrollY < wrapLow) { scrollY += wrap; targetY += wrap; }
  const center = leftCol.clientHeight / 2 - CONFIG.ITEM_H / 2;
  track.style.transform = `translateY(${Math.round(-scrollY + center)}px)`;
  const vel = scrollY - prevScrollY;
  if (Math.abs(vel) > 0.01) lastDir = vel > 0 ? 1 : -1;
  prevScrollY = scrollY;
  const ai = getActiveIndex(scrollY);
  counterNum.textContent = String(ai + 1).padStart(2, '0');
  allItems.forEach((el, gi) => el.classList.toggle('active', (gi % total) === ai));
  requestAnimationFrame(loop);
}

// ========================== EVENTOS E INICIALIZAÇÃO ==========================
const root = document.getElementById('portfolio-root');
root.addEventListener('wheel', e => { e.preventDefault(); handleInput(e.deltaY * CONFIG.WHEEL_SPEED); }, { passive: false });
let touchY = null;
root.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
root.addEventListener('touchmove', e => {
  e.preventDefault();
  const delta = (touchY - e.touches[0].clientY) * CONFIG.TOUCH_SPEED;
  handleInput(delta);
  touchY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('resize', () => {
  checkMobile();
  setTimeout(() => {
    if (!isMobile) {
      const newHeight = getItemHeight();
      if (Math.abs(CONFIG.ITEM_H - newHeight) > 2) {
        CONFIG.ITEM_H = newHeight;
        allItems.forEach(item => { item.style.height = CONFIG.ITEM_H + 'px'; });
        INITIAL_SCROLL = COPIES_ABOVE * total * CONFIG.ITEM_H;
        scrollY = INITIAL_SCROLL; targetY = INITIAL_SCROLL; prevScrollY = INITIAL_SCROLL;
      }
    } else {
      mobileItemHeight = getMobileItemHeight();
      mobileItems.forEach(item => { item.style.height = mobileItemHeight + 'px'; });
      mobileScrollY = COPIES_ABOVE * total * mobileItemHeight;
      mobileTargetY = mobileScrollY; mobilePrevScrollY = mobileScrollY;
    }
  }, 100);
});

checkMobile();
initMobile();
loop();
mobileLoop();
setTimeout(() => { isMobile ? showMobileImage(0) : showProject(0, 1); }, 350);
</script>
</body>
</html>
