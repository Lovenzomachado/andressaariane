<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Andressa Ariane | Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap');

    /* ── FONTE MANGO GROTESQUE do GitHub (Lovenzomachado/andressaariane) ── */
    @font-face {
      font-family: 'Mango Grotesque';
      src: url('https://raw.githubusercontent.com/Lovenzomachado/andressaariane/main/Mango%20Grotesque.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    #portfolio-root {
      width: 100%;
      height: 100vh;
      min-height: 520px;
      overflow: hidden;
      position: relative;
      background: #fff;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Grid principal 12 colunas ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      height: 100%;
    }

    /* ── Coluna esquerda: 8 de 12 colunas ── */
    .col-left {
      grid-column: 1 / 9;
      position: relative;
      overflow: hidden;
    }

    /* ── Coluna direita: 4 de 12 colunas ── */
    .col-right {
      grid-column: 9 / 13;
      position: relative;
      overflow: hidden;
    }

    /* ── Track que se move verticalmente com o scroll ── */
    .project-track {
      position: absolute;
      width: 100%;
      will-change: transform;
    }

    /* ── Item individual da lista ── */
    .project-item {
      padding: 0 28px 0 0;
      user-select: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      opacity: 0.2;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-item.active { opacity: 1; }

    /* ── Nome do projeto com MANGO GROTESQUE ── */
    .project-item .label {
      display: block;
      font-family: 'Mango Grotesque', 'DM Sans', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 168px;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #000;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Tag descritiva — ARIAL ── */
    .project-item .tag {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #aaa;
      white-space: nowrap;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.8s ease 0.15s;
      margin-left: 30px;
    }
    .project-item.active .tag { opacity: 1; }

    /* ── Stage das imagens ── */
    .image-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
    }

    /* ── Cada slot ocupa metade da altura ── */
    .image-slot {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .image-slide {
      position: absolute;
      inset: 0;
    }
    .image-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Label sobreposto na imagem (ARIAL) ── */
    .img-label {
      position: absolute;
      bottom: 14px;
      left: 16px;
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
    }

    /* ── Navegação superior (ARIAL) ── */
    nav {
      position: absolute;
      top: 26px; left: 52px; right: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .nav-logo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #000;
    }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #aaa;
      text-decoration: none;
      pointer-events: all;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: #000; }

    /* ── Hint de scroll (ARIAL) ── */
    .scroll-hint {
      position: absolute;
      bottom: 26px; left: 52px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scroll-hint::before {
      content: '';
      display: block;
      width: 20px;
      height: 0.5px;
      background: #ccc;
    }

    /* ── Contador (ARIAL) ── */
    .counter {
      position: absolute;
      bottom: 26px; right: 26px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: #ccc;
    }
    .counter span { color: #000; font-size: 12px; font-weight: 700; }

    /* Responsive adjustments */
    @media (max-width: 1400px) {
      .project-item .label { font-size: 148px; }
      .project-item { padding: 0 24px 0 0; }
    }

    @media (max-width: 1200px) {
      .project-item .label { font-size: 120px; }
    }

    @media (max-width: 1000px) {
      .project-item .label { font-size: 90px; }
      .project-item { padding: 0 20px 0 0; }
    }

    @media (max-width: 800px) {
      .project-item .label { font-size: 75px; }
    }

    @media (max-width: 768px) {
      .col-right { display: none; }
      .col-left { grid-column: 1 / 13; }
      .project-item .label { font-size: 65px; }
      .project-item { padding: 0 20px 0 0; }
      nav { left: 32px; top: 20px; }
      .scroll-hint { left: 32px; bottom: 20px; }
      .counter { right: 20px; bottom: 20px; }
    }

    @media (max-width: 600px) {
      .project-item .label { font-size: 52px; }
    }

    @media (max-width: 480px) {
      .project-item .label { font-size: 42px; }
      .project-item .tag { font-size: 8px; margin-left: 15px; }
    }

    @media (max-width: 400px) {
      .project-item .label { font-size: 36px; }
    }
  </style>
</head>
<body>
<div id="portfolio-root">
  <nav>
    <div class="nav-logo">Andressa Ariane</div>
    <div class="nav-links">
      <a href="#">Sobre mim</a>
      <a href="#">Contato</a>
    </div>
  </nav>

  <div class="grid">
    <div class="col-left" id="left-col">
      <div class="project-track" id="project-track"></div>
    </div>
    <div class="col-right">
      <div class="image-stage" id="image-stage">
        <div class="image-slot" id="slot-top"></div>
        <div class="image-slot" id="slot-bot"></div>
      </div>
    </div>
  </div>

  <div class="scroll-hint">Scroll para navegar</div>
  <div class="counter"><span id="counter-num">01</span> / 06</div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// PROJETOS - IMAGENS DO REPOSITÓRIO
// ─────────────────────────────────────────────────────────────────────────────
const IMG_BASE_URL = 'https://raw.githubusercontent.com/Lovenzomachado/andressaariane/main/projects/';

const projects = [
  { name: "Ipanema Pluma",   tag: "Identidade Visual", images: [
    `${IMG_BASE_URL}ipanema-pluma.avif`,
    `${IMG_BASE_URL}ipanema-pluma.avif`
  ]},
  { name: "Quinto Andar",    tag: "Branding Digital", images: [
    `${IMG_BASE_URL}quintoandar.avif`,
    `${IMG_BASE_URL}quintoandar.avif`
  ]},
  { name: "Élev Experience", tag: "Skincare Print", images: [
    `${IMG_BASE_URL}elev.avif`,
    `${IMG_BASE_URL}elev.avif`
  ]},
  { name: "Unimed VTRP",     tag: "Campanha", images: [
    `${IMG_BASE_URL}unimed.avif`,
    `${IMG_BASE_URL}unimed.avif`
  ]},
  { name: "Kero Fazê",       tag: "Social Media", images: [
    `${IMG_BASE_URL}kerofaze.avif`,
    `${IMG_BASE_URL}kerofaze.avif`
  ]},
  { name: "Museu da PUC",    tag: "Editorial", images: [
    `${IMG_BASE_URL}puc.avif`,
    `${IMG_BASE_URL}puc.avif`
  ]}
];

// ─────────────────────────────────────────────────────────────────────────────
// CONFIGURAÇÃO
// ─────────────────────────────────────────────────────────────────────────────
function getItemHeight() {
  const label = document.querySelector('.project-item .label');
  if (!label) return 170;
  
  const fontSize = parseFloat(getComputedStyle(label).fontSize);
  const lineHeight = fontSize * 0.9;
  return Math.ceil(lineHeight + 30);
}

const CONFIG = {
  ITEM_H:         170,
  COPIES:         7,
  LERP:           0.038,
  WHEEL_SPEED:    0.42,
  TOUCH_SPEED:    1.1,
  IDLE_MS:        220,
  ENTER_DELAY_MS: 380,

  EXIT: {
    duration:   500,
    easing:     'cubic-bezier(0.4, 0, 1, 1)',
    translateX: -24,
  },
  ENTER: {
    duration:   1100,
    easing:     'cubic-bezier(0.16, 1, 0.3, 1)',
    translateX: 65,
    stagger:    130,
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// ELEMENTOS DO DOM
// ─────────────────────────────────────────────────────────────────────────────
const total      = projects.length;
const track      = document.getElementById('project-track');
const stage      = document.getElementById('image-stage');
const slotTop    = document.getElementById('slot-top');
const slotBot    = document.getElementById('slot-bot');
const counterNum = document.getElementById('counter-num');
const leftCol    = document.getElementById('left-col');

const COPIES_ABOVE = Math.floor(CONFIG.COPIES / 2);

// ─────────────────────────────────────────────────────────────────────────────
// GERA A LISTA REPETIDA
// ─────────────────────────────────────────────────────────────────────────────
for (let c = 0; c < CONFIG.COPIES; c++) {
  projects.forEach(p => {
    const el = document.createElement('div');
    el.className = 'project-item';
    el.style.height = CONFIG.ITEM_H + 'px';
    el.innerHTML = `<span class="label">${p.name}</span><span class="tag">${p.tag}</span>`;
    track.appendChild(el);
  });
}
const allItems = Array.from(track.querySelectorAll('.project-item'));

// Atualiza altura baseada no CSS
setTimeout(() => {
  CONFIG.ITEM_H = getItemHeight();
  allItems.forEach(item => {
    item.style.height = CONFIG.ITEM_H + 'px';
  });
}, 100);

// ─────────────────────────────────────────────────────────────────────────────
// SCROLL
// ─────────────────────────────────────────────────────────────────────────────
let INITIAL_SCROLL = COPIES_ABOVE * total * CONFIG.ITEM_H;
let scrollY     = INITIAL_SCROLL;
let targetY     = INITIAL_SCROLL;
let prevScrollY = INITIAL_SCROLL;
let lastDir     = 1;
let isScrolling = false;
let idleTimer   = null;
let enterTimer  = null;

// ─────────────────────────────────────────────────────────────────────────────
// ESTADO DAS IMAGENS
// ─────────────────────────────────────────────────────────────────────────────
const state = { visible: false, activeIdx: -1 };

function clearSlots() {
  slotTop.innerHTML = '';
  slotBot.innerHTML = '';
}

function hideStage() {
  if (!state.visible) return;
  state.visible   = false;
  state.activeIdx = -1;
  stage.style.transition = 'opacity 0.3s ease';
  stage.style.opacity    = '0';
  setTimeout(clearSlots, 320);
}

function showProject(idx, dir) {
  if (state.activeIdx === idx) return;
  state.activeIdx = idx;
  state.visible   = true;

  clearSlots();

  const p   = projects[idx];
  const xIn = dir >= 0 ? CONFIG.ENTER.translateX : -CONFIG.ENTER.translateX;

  // ORDEM TROCADA: slot-bot (embaixo) aparece primeiro, depois slot-top (em cima)
  // Isso cria um efeito de cascata de baixo para cima
  const slots = [slotBot, slotTop];
  
  slots.forEach((slot, si) => {
    const slide = document.createElement('div');
    slide.className = 'image-slide';
    // Usa a imagem correspondente
    const imgUrl = p.images[0]; // ambas imagens são iguais por enquanto
    slide.innerHTML = `<img src="${imgUrl}" alt="${p.name} - ${p.tag}" loading="lazy" /><span class="img-label">${p.tag} — 0${si + 1}</span>`;
    slide.style.transform = `translateX(${xIn}px)`;
    // SEM OPACIDADE - apenas movimento
    slot.appendChild(slide);

    // Delay maior para o primeiro slot (agora slot-bot) e menor para o segundo
    const delay = si === 0 ? 0 : CONFIG.ENTER.stagger;
    slide.animate(
      [
        { transform: `translateX(${xIn}px)` },
        { transform: 'translateX(0px)' },
      ],
      { duration: CONFIG.ENTER.duration, delay, easing: CONFIG.ENTER.easing, fill: 'forwards' }
    );
  });

  stage.style.transition = 'opacity 0.2s ease';
  stage.style.opacity    = '1';
}

// ─────────────────────────────────────────────────────────────────────────────
// ÍNDICE ATIVO
// ─────────────────────────────────────────────────────────────────────────────
function getActiveIndex(y) {
  const wrap = total * CONFIG.ITEM_H;
  return Math.round(((y % wrap) + wrap) % wrap / CONFIG.ITEM_H) % total;
}

function onIdle() {
  isScrolling = false;
  const idx   = getActiveIndex(scrollY);
  clearTimeout(enterTimer);
  enterTimer  = setTimeout(() => showProject(idx, lastDir), CONFIG.ENTER_DELAY_MS);
}

function handleInput(delta) {
  targetY += delta;
  clearTimeout(enterTimer);

  if (!isScrolling) {
    isScrolling = true;
    hideStage();
  }

  clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdle, CONFIG.IDLE_MS);
}

// ─────────────────────────────────────────────────────────────────────────────
// LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop() {
  scrollY += (targetY - scrollY) * CONFIG.LERP;

  const wrap     = total * CONFIG.ITEM_H;
  const wrapLow  = INITIAL_SCROLL - wrap;
  const wrapHigh = INITIAL_SCROLL + wrap * (CONFIG.COPIES - COPIES_ABOVE - 1);

  if (scrollY > wrapHigh) { scrollY -= wrap; targetY -= wrap; }
  if (scrollY < wrapLow)  { scrollY += wrap; targetY += wrap; }

  const colH   = leftCol.clientHeight;
  const center = colH / 2 - CONFIG.ITEM_H / 2;
  track.style.transform = `translateY(${Math.round(-scrollY + center)}px)`;

  const vel = scrollY - prevScrollY;
  if (Math.abs(vel) > 0.01) lastDir = vel > 0 ? 1 : -1;
  prevScrollY = scrollY;

  const ai = getActiveIndex(scrollY);
  counterNum.textContent = String(ai + 1).padStart(2, '0');
  allItems.forEach((el, gi) => el.classList.toggle('active', (gi % total) === ai));

  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENTOS
// ─────────────────────────────────────────────────────────────────────────────
const root = document.getElementById('portfolio-root');

root.addEventListener('wheel', e => {
  e.preventDefault();
  handleInput(e.deltaY * CONFIG.WHEEL_SPEED);
}, { passive: false });

let touchY = null;
root.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
root.addEventListener('touchmove', e => {
  e.preventDefault();
  handleInput((touchY - e.touches[0].clientY) * CONFIG.TOUCH_SPEED);
  touchY = e.touches[0].clientY;
}, { passive: false });

// Recalcula altura no resize
window.addEventListener('resize', () => {
  setTimeout(() => {
    const newHeight = getItemHeight();
    if (Math.abs(CONFIG.ITEM_H - newHeight) > 2) {
      CONFIG.ITEM_H = newHeight;
      allItems.forEach(item => {
        item.style.height = CONFIG.ITEM_H + 'px';
      });
      INITIAL_SCROLL = COPIES_ABOVE * total * CONFIG.ITEM_H;
      scrollY = INITIAL_SCROLL;
      targetY = INITIAL_SCROLL;
      prevScrollY = INITIAL_SCROLL;
    }
  }, 100);
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
loop();
setTimeout(() => showProject(0, 1), 350);
</script>
</body>
</html>
